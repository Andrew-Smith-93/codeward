<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="900" height="380" fill="#030712" rx="12" />

  <!-- Terminal Window -->
  <g filter="url(#shadow)">
    <rect x="25" y="25" width="850" height="330" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
    
    <!-- Titlebar Buttons -->
    <circle cx="50" cy="50" r="6" fill="#ff5f56" />
    <circle cx="70" cy="50" r="6" fill="#ffbd2e" />
    <circle cx="90" cy="50" r="6" fill="#27c93f" />
    <text x="450" y="55" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" text-anchor="middle">codeward review --base main</text>
    <line x1="25" y1="72" x2="875" y2="72" stroke="#30363d" stroke-width="1" />
  </g>

  <!-- Content Lines -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="13">
    <!-- Header Banner -->
    <text x="50" y="105" fill="#38bdf8" font-weight="bold">🛡️  CODEWARD</text>
    <text x="170" y="105" fill="#94a3b8">v1.0.0 • Multi-Agent Code Review &amp; Security Audit</text>

    <text x="50" y="135" fill="#e2e8f0" font-weight="bold">Verdict:   </text>
    <rect x="135" y="122" width="68" height="18" rx="4" fill="#dc2626" />
    <text x="143" y="136" fill="#ffffff" font-weight="bold" font-size="11">✖ FAIL</text>
    <text x="215" y="135" fill="#94a3b8">Identified 2 issues across 1 file: 1 Critical, 1 Warning.</text>

    <!-- Finding 1: Critical -->
    <text x="50" y="175" fill="#f87171" font-weight="bold">#1</text>
    <rect x="75" y="162" width="95" height="18" rx="4" fill="#ef4444" />
    <text x="83" y="176" fill="#ffffff" font-weight="bold" font-size="11"> CRITICAL </text>
    <text x="180" y="175" fill="#f1f5f9" font-weight="bold">Hardcoded API secret token found in source code</text>

    <text x="75" y="200" fill="#64748b">Location:</text>
    <text x="145" y="200" fill="#38bdf8" text-decoration="underline">src/auth/login.ts:24</text>
    <text x="310" y="200" fill="#64748b">(SEC-001-SECRET-LEAK)</text>
    <text x="500" y="200" fill="#94a3b8">[security-sentinel]</text>

    <!-- Snippet & Fix -->
    <text x="75" y="225" fill="#ef4444">│</text>
    <text x="90" y="225" fill="#cbd5e1"><tspan fill="#ef4444">-</tspan> const API_KEY = "sk_live_99238472938472938472";</text>
    <text x="75" y="245" fill="#22c55e">│</text>
    <text x="90" y="245" fill="#cbd5e1"><tspan fill="#22c55e">+</tspan> const API_KEY = process.env.API_KEY;</text>

    <!-- Finding 2: Warning -->
    <text x="50" y="285" fill="#facc15" font-weight="bold">#2</text>
    <rect x="75" y="272" width="90" height="18" rx="4" fill="#eab308" />
    <text x="83" y="286" fill="#000000" font-weight="bold" font-size="11"> WARNING </text>
    <text x="175" y="285" fill="#f1f5f9" font-weight="bold">Uncaught asynchronous promise rejection in event handler</text>

    <text x="75" y="310" fill="#64748b">Location:</text>
    <text x="145" y="310" fill="#38bdf8" text-decoration="underline">src/events/dispatcher.ts:58</text>
    <text x="360" y="310" fill="#64748b">(LOGIC-003-ASYNC)</text>
    <text x="520" y="310" fill="#94a3b8">[logic-hound]</text>

    <text x="75" y="335" fill="#22c55e">Suggested Fix: await notifySubscribers(event).catch(err =&gt; logger.error(err));</text>
  </g>
</svg>
