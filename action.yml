name: 'Codeward Multi-Agent Code Review'
description: 'Runs parallel multi-agent security audits and reliability reviews on pull requests'
author: 'Codeward'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  provider:
    description: 'LLM provider (openai, anthropic, gemini, ollama)'
    required: false
    default: 'openai'
  model:
    description: 'Model identifier (e.g. gpt-4o-mini, claude-3-5-sonnet-20241022, gemini-2.0-flash)'
    required: false
    default: ''
  api-key:
    description: 'API key for the chosen LLM provider'
    required: false
    default: ''
  api-url:
    description: 'Custom API base URL'
    required: false
    default: ''
  base-branch:
    description: 'Target base branch for diff analysis'
    required: false
    default: 'origin/main'
  fail-on:
    description: 'Exit code 1 threshold (critical, warning, suggestion, none)'
    required: false
    default: 'critical'
  agents:
    description: 'Comma-separated agents to run (security, logic, performance)'
    required: false
    default: 'security,logic,performance'
  github-token:
    description: 'GitHub token for posting review comments to Pull Request'
    required: false
    default: ''
  comment-on-pr:
    description: 'Post review markdown as PR comment'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install and Build Codeward
      shell: bash
      env:
        CODEWARD_ACTION_PATH: ${{ github.action_path }}
      run: |
        cd "$CODEWARD_ACTION_PATH"
        npm ci
        npm run build
        npm link

    - name: Run Multi-Agent Review
      id: review
      shell: bash
      env:
        CODEWARD_ACTION_PATH: ${{ github.action_path }}
        INPUT_BASE_BRANCH: ${{ inputs.base-branch }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_AGENTS: ${{ inputs.agents }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_API_URL: ${{ inputs.api-url }}
        OPENAI_API_KEY: ${{ inputs.api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.api-key }}
        GEMINI_API_KEY: ${{ inputs.api-key }}
      run: |
        bash "$CODEWARD_ACTION_PATH/scripts/action-review.sh"

    - name: Comment on PR
      if: ${{ always() && inputs.comment-on-pr == 'true' && inputs.github-token != '' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      env:
        CODEWARD_ACTION_PATH: ${{ github.action_path }}
        CODEWARD_REPORT_PATH: ${{ steps.review.outputs.report-path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const path = require('node:path');
          const postReport = require(path.join(process.env.CODEWARD_ACTION_PATH, 'scripts/action-comment.cjs'));
          await postReport({ github, context, core, reportPath: process.env.CODEWARD_REPORT_PATH });
