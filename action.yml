name: 'Codeward Multi-Agent Code Review'
description: 'Offline mock smoke check for Codeward on a Git diff; no security verdict'
author: 'Codeward'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  base-branch:
    description: 'Existing origin remote-tracking branch, e.g. origin/main. Check out with full history first.'
    required: false
    default: 'origin/main'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22

    - name: Build Codeward from lockfile
      shell: bash
      env:
        CODEWARD_ACTION_PATH: ${{ github.action_path }}
      run: |
        cd "$CODEWARD_ACTION_PATH"
        npm ci --ignore-scripts --no-audit --no-fund
        npm run build

    - name: Run the offline mock smoke check
      shell: bash
      env:
        CODEWARD_ACTION_PATH: ${{ github.action_path }}
        CODEWARD_BASE_REF: ${{ inputs.base-branch }}
      run: bash "$CODEWARD_ACTION_PATH/scripts/action-smoke.sh"
